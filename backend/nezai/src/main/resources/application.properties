spring.application.name=nezai
server.port=8081
ollama.url=http://localhost:11434
ollama.model=qwen3.5:4b
ollama.think=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local whisper.cpp configuration. Set paths here or override them with
# SPEECH_WHISPER_EXECUTABLE and SPEECH_WHISPER_MODEL environment variables.
speech.whisper.executable=${SPEECH_WHISPER_EXECUTABLE:tools/whisper/Release/whisper-cli.exe}
speech.whisper.model=${SPEECH_WHISPER_MODEL:models/ggml-base.en.bin}
speech.whisper.language=${SPEECH_WHISPER_LANGUAGE:en}
speech.whisper.threads=${SPEECH_WHISPER_THREADS:4}
speech.whisper.timeout-seconds=${SPEECH_WHISPER_TIMEOUT_SECONDS:120}
